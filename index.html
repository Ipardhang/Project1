<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project 1</title>
<style>
body{font-family:system-ui,sans-serif;max-width:720px;margin:0 auto;padding:40px 20px;line-height:1.6;background:#f5f7fb;color:#172033}
main{background:white;padding:28px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
button{padding:10px 16px;border:0;border-radius:10px;background:#2563eb;color:white;cursor:pointer}
#count{font-weight:700}
</style>
</head>
<body><main>
<h1>Project 1</h1>
<p>A small interactive JavaScript starter project.</p>
<p>Button clicks: <span id="count">0</span></p>
<button id="btn">Click me</button>
<script>
let count=0;
document.getElementById('btn').addEventListener('click',()=>{
  count++;
  document.getElementById('count').textContent=count;
});
</script>
</main></body></html>
